name: TechLedger MVP Block Churn

on:
  workflow_dispatch:
  push:
    paths:
      - 'techledger_mvp/**'
      - 'scripts/techledger_enrich_contributor_context.py'
      - 'scripts/techledger_corrective_test.py'
      - '.github/workflows/techledger-mvp-block-churn.yml'

jobs:
  block-churn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run function-level churn scan
        run: python techledger_mvp/block_churn_scan.py
      - name: Add historical contributor and ownership context
        run: python scripts/techledger_enrich_contributor_context.py
      - name: Run corrective-burden gate
        run: python scripts/techledger_corrective_test.py
      - name: Rank broad admission-time markers
        run: python techledger_mvp/analyze_block_churn.py
      - name: Commit compact outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techledger_mvp/output/commit_metrics.csv techledger_mvp/output/scan_summary.json techledger_mvp/output/marker_rankings.json techledger_mvp/output/corrective_metrics.csv techledger_mvp/output/corrective_rankings.json
          git diff --cached --quiet || git commit -m "Add TechLedger corrective burden gate results"
          git push
