name: TechLedger Phase 0 Checkpoint

on:
  workflow_dispatch:
  push:
    paths:
      - 'techledger_phase0/checkpoint_stream.py'
      - '.github/workflows/techledger-phase0.yml'

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run streaming checkpoint
        run: python techledger_phase0/checkpoint_stream.py
      - name: Commit compact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techledger_phase0/checkpoint_summary.json
          git diff --cached --quiet || git commit -m "Add TechLedger Phase 0 checkpoint result"
          git push
